services:
  redis:
    image: redis:8-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data

  redis-http:
    image: hiett/serverless-redis-http:0.0.10
    ports:
      - '8079:80'
    environment:
      SRH_MODE: env
      SRH_TOKEN: local-dev-token
      SRH_CONNECTION_STRING: redis://redis:6379
    depends_on:
      - redis

volumes:
  redis-data:
