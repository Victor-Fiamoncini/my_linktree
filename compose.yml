services:
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: my_linktree
      POSTGRES_PASSWORD: my_linktree
      POSTGRES_DB: my_linktree_development
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
