      heading: "Onde eu trabalhei"
    contact_form_section:
      prompt: "$ echo \"vamos conversar\""
      heading: "Vamos conversar"
      intro: "Trabalhando em algo interessante? Estou sempre aberto a vagas remotas, trabalhos freelance e colaborações fullstack — do desenvolvimento frontend e backend a sistemas agênticos, landing pages e aplicativos mobile. Deixe alguns detalhes abaixo se você tiver um projeto em mente, e eu retornarei o mais rápido possível. Vamos conversar!"
    contact_form:
      name_label: "nome"
      email_label: "email"
      message_label: "mensagem"
      submit: "Enviar"
      submit_title: "Enviar Mensagem"
      sending: "Enviando..."
      generic_error: "Algo deu errado. Verifique sua conexão e tente novamente."
    hire_from_agent:
      prompt: "$ ./hire-me --no-human-required"
      heading: "Contrate-me pelo seu agente"
      intro_html: "Este portfólio fala %{mcp_link}! Ele expõe um %{mcp_server} junto com o próprio site, com quatro ferramentas. Você pode adicionar este portfólio como um conector no seu agente favorito (Claude, ChatGPT, Deepseek, Kimi, etc). Seu agente poderá verificar meu trabalho, checar minha disponibilidade e agendar uma reunião."
      mcp_link_title: "Model Context Protocol"
      mcp_server: "servidor MCP"
      copy_endpoint_title: "Copiar endpoint do MCP"
      no_auth_note: "# Não é necessária conta ou autenticação"
      watch_telemetry_note_html: "# Acompanhe conexões de agentes ao vivo: %{url}"
      follow_up: "Você também pode colar este briefing no seu agente. Qualquer agente pode lê-lo e falar comigo diretamente pela minha API (sem necessidade de configurar um conector MCP)."
      copy_agents_md_title: "Copiar AGENTS.md"
      agents_md_title: "# AGENTS.md — contrate Victor Fiamoncini"
      agents_md_contact_line: "Para me contatar diretamente:"
      agents_md_services_line: "Serviços: Desenvolvimento de Software Frontend & Backend, Sistemas Agênticos & Integrações, Sites & Landing Pages e Aplicativos Mobile"
      copy: "Copiar"
      copied: "Copiado!"

  telemetry_page:
    title: "Telemetria de Agentes ao Vivo"
    og_title: "Telemetria de Agentes ao Vivo — Victor Fiamoncini"
    description: "Acompanhe agentes de IA se conectando ao servidor MCP de Victor Fiamoncini em tempo real — chamadas de ferramentas, horários e atividade ao vivo."
