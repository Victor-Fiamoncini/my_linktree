  pages:
    hero:
      lede: "Engenheiro de Software desde %{year}, em empresas e projetos freelance."
      intro_html: "Eu construo produtos full-stack majoritariamente com %{rails_link} e %{nextjs_link}, desde o design de esquemas relacionais e jobs em background até server components e tudo o que há no meio, com responsabilidade de ponta a ponta até a produção."
      rails_link_title: "Site oficial do Ruby on Rails"
      nextjs_link_title: "Site oficial do Next.js"
      pull_quote: "Projetos de escopo fechado, execução sênior, sem necessidade de acompanhamento constante."
      agents_note: "Ultimamente isso inclui lançar coisas com as quais agentes de IA podem conversar diretamente, como o servidor MCP que roda esta própria página."
      photo_alt: "Victor Fiamoncini"
      photo_link_title: "Victor Fiamoncini no LinkedIn"
    experiences:
      prompt: "$ cat career.log"
      heading: "Onde eu trabalhei"
    contact_form_section:
      prompt: "$ echo \"vamos conversar\""
      heading: "Vamos conversar"
      intro: "Trabalhando em algo interessante? Estou sempre aberto a vagas remotas, trabalhos freelance e colaborações fullstack — do desenvolvimento frontend e backend a sistemas agênticos, landing pages e aplicativos mobile. Deixe alguns detalhes abaixo se você tiver um projeto em mente, e eu retornarei o mais rápido possível. Vamos conversar!"
    contact_form:
      name_label: "nome"
      email_label: "email"
      message_label: "mensagem"
      submit: "Enviar"
      submit_title: "Enviar Mensagem"
      sending: "Enviando..."
      generic_error: "Algo deu errado. Verifique sua conexão e tente novamente."
    hire_from_agent:
      prompt: "$ ./hire-me --no-human-required"
      heading: "Contrate-me pelo seu agente"
      intro_html: "Este portfólio fala %{mcp_link}! Ele expõe um %{mcp_server} junto com o próprio site, com cinco ferramentas. Você pode adicionar este portfólio como um conector no seu agente favorito (Claude, ChatGPT, Deepseek, Kimi, etc). Seu agente poderá verificar meu trabalho, avaliar meu fit com uma vaga, checar minha disponibilidade e agendar uma reunião."
      mcp_link_title: "Model Context Protocol"
      mcp_server: "servidor MCP"
      copy_endpoint_title: "Copiar endpoint do MCP"
      no_auth_note: "# Não é necessária conta ou autenticação"
      watch_telemetry_note_html: "# Acompanhe conexões de agentes ao vivo: %{url}"
      follow_up: "Você também pode colar este briefing no seu agente. Qualquer agente pode lê-lo e falar comigo diretamente pela minha API (sem necessidade de configurar um conector MCP)."
      copy_agents_md_title: "Copiar AGENTS.md"
      agents_md_title: "# AGENTS.md — contrate Victor Fiamoncini"
      agents_md_contact_line: "Para me contatar diretamente:"
      agents_md_services_line: "Serviços: Desenvolvimento de Software Frontend & Backend, Sistemas Agênticos & Integrações, Sites & Landing Pages e Aplicativos Mobile"
      copy: "Copiar"
      copied: "Copiado!"
    job_match:
      prompt: "$ cat job.txt | ./match --rag"
      heading: "Tenho fit com a sua vaga?"
      intro_html: "Cole a descrição de uma vaga. Esta seção usa %{rag_link} (geração aumentada por recuperação): busca os trechos mais próximos do meu currículo e dos meus projetos no GitHub, e a OpenAI escreve, com base neles, como a minha experiência se encaixa na vaga. A avaliação é gerada em inglês."
      rag_link_title: "Retrieval-augmented generation"
      label: "descrição da vaga"
      placeholder: "Cole a descrição da vaga aqui..."
      submit: "Avaliar o fit"
      submitting: "Lendo a vaga e buscando no meu trabalho..."
      generic_error: "Algo deu errado. Verifique sua conexão e tente novamente."

  telemetry_page:
    title: "Telemetria de Agentes ao Vivo"
    og_title: "Telemetria de Agentes ao Vivo — Victor Fiamoncini"
    description: "Acompanhe agentes de IA se conectando ao servidor MCP de Victor Fiamoncini em tempo real — chamadas de ferramentas, horários e atividade ao vivo."
    prompt: "$ tail -f /var/log/agents.log"
    heading: "Telemetria de Agentes ao Vivo"
    intro_html: "Um feed ao vivo das chamadas de ferramentas %{mcp} mais recentes recebidas por este portfólio, atualizado em tempo real. Cada entrada mostra qual ferramenta um agente chamou e quando, seja lendo meu currículo, checando disponibilidade ou agendando uma reunião."
    live: "ao vivo"
    loading: "# carregando telemetria ao vivo..."
    error: "# erro: algo deu errado ao carregar a telemetria ao vivo."
    empty: "# nenhuma conexão de agente ainda."

