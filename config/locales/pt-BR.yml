    heading: "Telemetria de Agentes ao Vivo"
    intro_html: "Um feed ao vivo das chamadas de ferramentas %{mcp} mais recentes recebidas por este portfólio, atualizado em tempo real. Cada entrada mostra qual ferramenta um agente chamou e quando, seja lendo meu currículo, checando disponibilidade ou agendando uma reunião."
