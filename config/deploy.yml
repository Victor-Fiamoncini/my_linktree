# Name of your application. Used to uniquely configure containers.
service: my_linktree

# Name of the container image.
image: victorfiamon/my_linktree

# Deploy to these servers. Kept out of plain text (this repo is public, and the origin IP
# is otherwise only reachable through Cloudflare's proxy) — exported via .kamal/secrets.
servers:
  web:
    hosts:
      - <%= ENV.fetch("KAMAL_SERVER_IP") %>
    env:
      clear:
        WEB_CONCURRENCY: 2 # 1 Puma worker per vCPU
        RAILS_MAX_THREADS: 5 # 10 concurrent requests; mostly IO-bound (OpenAI, SMTP)

  # Solid Queue supervisor only. Its default single worker covers the handful of mailer jobs.
  job:
    hosts:
      - <%= ENV.fetch("KAMAL_SERVER_IP") %>
    cmd: bin/jobs

# Enable SSL auto certification via Let's Encrypt and allow for multiple apps on a single web server.
# Remove this section when using multiple web servers and ensure you terminate SSL at your load balancer.
#
# Cloudflare's SSL/TLS mode is "Full (strict)", which validates this Let's Encrypt cert (see README).
#
# With ssl: true kamal-proxy would replace X-Forwarded-For with its own peer — a Cloudflare edge
# IP — dropping the visitor. forward_headers keeps the visitor Cloudflare put there, and
# config/initializers/trusted_proxies.rb lets request.remote_ip walk past the Cloudflare hop.
proxy:
  ssl: true
  forward_headers: true
  hosts:
    - victorfiamon.com.br
    - www.victorfiamon.com.br
  healthcheck:
    timeout: 120
  # Proxy connects to your container on port 80 by default (matches Dockerfile's EXPOSE 80 / Thruster).

# Credentials for your image host.
registry:
  username: victorfiamon

  # Always use an access token rather than real password (pulled from .kamal/secrets).
  password:
    - KAMAL_REGISTRY_PASSWORD

# Database host/port/username/password, mailer sender/recipient, and the Resend API key
# all live in config/credentials/production.yml.enc instead of plain env vars.
# RAILS_MASTER_KEY below is what decrypts that file at boot (it's config/credentials/production.key)
# — the only env var the app needs from Kamal.
env:
  secret:
    - RAILS_MASTER_KEY
  # Leave SOLID_QUEUE_IN_PUMA unset: jobs run in the `job` role, and puma.rb treats any
  # value (even "false") as on, so each Puma worker would start a duplicate supervisor.
  #
  # Increase log verbosity temporarily for debugging deploys:
  # clear:
  #   RAILS_LOG_LEVEL: debug

# Useful shortcuts for day-to-day operations.
aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

# Use a persistent storage volume for Active Storage (local disk service in production).
volumes:
  - "my_linktree_storage:/rails/storage"

# Use a different ssh user than root
ssh:
  user: foo

# Bridge fingerprinted assets, like JS and CSS, between versions to avoid
# hitting 404 on in-flight requests. Combines all files from a new and old
# version inside the asset_path.
asset_path: /rails/public/assets

# Image builder configuration.
builder:
  # Hetzner VPS runs amd64. If you are on Apple Silicon (arm64), Docker Desktop
  # can build for amd64 via QEMU, but it is slow. A faster alternative is to
  # build directly on the Hetzner server itself:
  #
  # remote: ssh://foo@YOUR_HETZNER_IPV4
  #
  # With `remote` set, Kamal builds the image on the VPS (native amd64) and
  # pushes it from there. Remove `arch` when using `remote`.
  arch: amd64

# Configure rolling deploys by setting a wait time between batches of restarts.
#
# boot:
#   limit: 10 # Can also specify as a percentage of total hosts, such as "25%"
#   wait: 2

# No accessories block: Postgres is an external managed instance, reached via
# database.host/port/username/password in config/credentials/production.yml.enc
# (see config/database.yml).
